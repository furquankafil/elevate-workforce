{% load static %}

<!-- Floating Launcher Button -->
<button id="ai-chat-trigger" class="ai-agent-floating-btn" aria-label="Open 24/7 AI Assistant">
    <div class="ai-btn-pulse"></div>
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; z-index: 2;">
        <!-- Embedded HD Robot Logo -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36">
            <defs>
                <linearGradient id="launcherRobotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00AEEF" />
                    <stop offset="100%" stop-color="#0B3D91" />
                </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="30" fill="url(#launcherRobotGrad)"/>
            <path d="M 20 22 L 44 22 C 48 22 50 26 50 30 L 50 42 C 50 46 48 48 44 48 L 20 48 C 16 48 14 46 14 42 L 14 30 C 14 26 16 22 20 22 Z" fill="#FFFFFF"/>
            <circle cx="24" cy="32" r="4" fill="#00AEEF"/>
            <circle cx="40" cy="32" r="4" fill="#00AEEF"/>
            <path d="M 28 40 Q 32 44 36 40" stroke="#0B3D91" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <line x1="32" y1="12" x2="32" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
            <circle cx="32" cy="10" r="3" fill="#25D366"/>
        </svg>
    </div>
    <span class="ai-online-badge"></span>
</button>

<div id="ai-chat-window" class="ai-chat-drawer d-none">
    {% csrf_token %}

    <!-- Fixed Header -->
    <div class="ai-chat-header d-flex align-items-center justify-content-between p-3 bg-gradient-premium text-white">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-white p-1 rounded-circle" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28">
                    <circle cx="32" cy="32" r="30" fill="#0B3D91"/>
                    <path d="M 20 22 L 44 22 C 48 22 50 26 50 30 L 50 42 C 50 46 48 48 44 48 L 20 48 C 16 48 14 46 14 42 L 14 30 C 14 26 16 22 20 22 Z" fill="#FFFFFF"/>
                    <circle cx="24" cy="32" r="4" fill="#00AEEF"/>
                    <circle cx="40" cy="32" r="4" fill="#00AEEF"/>
                    <path d="M 28 40 Q 32 44 36 40" stroke="#0B3D91" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <h5 class="poppins-bold fs-14 mb-0">Elevate_Workforce AI</h5>
                <span class="fs-11 poppins-regular text-light-muted d-flex align-items-center gap-1">
                    <span class="ai-pulse-dot"></span> Instant Sourcing Support, 24/7
                </span>
            </div>
        </div>
        <button id="ai-chat-close" class="btn-close btn-close-white shadow-none" aria-label="Close Chat"></button>
    </div>

    <div class="progress rounded-0 bg-light" style="height: 4px; flex-shrink: 0;">
        <div id="ai-progress-bar" class="progress-bar bg-warning" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    </div>

    <!-- Scrollable Body Container -->
    <div id="ai-chat-body-wrap" class="ai-chat-body p-3">
        <div class="d-flex align-items-start gap-2 mb-3">
            <div class="bg-white border p-1 rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="26" height="26">
                    <circle cx="32" cy="32" r="30" fill="#00AEEF"/>
                    <path d="M 20 22 L 44 22 C 48 22 50 26 50 30 L 50 42 C 50 46 48 48 44 48 L 20 48 C 16 48 14 46 14 42 L 14 30 C 14 26 16 22 20 22 Z" fill="#FFFFFF"/>
                    <circle cx="24" cy="32" r="3.5" fill="#0B3D91"/>
                    <circle cx="40" cy="32" r="3.5" fill="#0B3D91"/>
                </svg>
            </div>
            <div class="bot-msg-bubble poppins-regular fs-13">
                Hello! I am your <strong>Elevate Workforce</strong> 24/7 Sourcing Assistant.
                <br><br>
                Please choose your requirement to begin:
            </div>
        </div>
        
        <div id="ai-initial-fork" class="d-grid gap-2 mb-3">
            <button class="btn btn-outline-custom text-start p-3 bg-white shadow-sm border-light-subtle ai-fork-btn" data-role="candidate">
                <i class="fa-solid fa-user-tie text-primary me-2 fs-5"></i>
                <div>
                    <strong class="text-dark d-block fs-13">I am looking for international jobs</strong>
                    <span class="text-muted fs-11">Register profile & explore vacant openings</span>
                </div>
            </button>
            <button class="btn btn-outline-custom text-start p-3 bg-white shadow-sm border-light-subtle ai-fork-btn" data-role="employer">
                <i class="fa-solid fa-building text-secondary me-2 fs-5"></i>
                <div>
                    <strong class="text-dark d-block fs-13">I am an Employer / Recruiting Client</strong>
                    <span class="text-muted fs-11">Source skilled crews, welders, & engineers</span>
                </div>
            </button>
        </div>
    </div>

    <input type="file" id="ai-resume-file" style="display: none;" accept=".pdf,.doc,.docx">
    <div id="ai-dynamic-options-bar" class="px-3 py-2 border-top bg-white d-none d-flex flex-wrap gap-1" style="flex-shrink: 0;"></div>

    <div id="ai-typing-indicator" class="ai-typing-wrap d-none px-3 py-2 border-top bg-light" style="flex-shrink: 0;">
        <div class="d-flex align-items-center gap-2 text-muted fs-12 poppins-medium">
            <span class="spinner-border spinner-border-sm text-primary" role="status" style="width: 12px; height: 12px;"></span>
            <span id="ai-indicator-text">Sourcing Assistant is typing...</span>
        </div>
    </div>

    <!-- Fixed Footer Input -->
    <div class="ai-chat-footer p-3 border-top bg-white">
        <form id="ai-chat-form" class="d-flex gap-2 align-items-center">
            <button type="button" id="ai-attach-trigger" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center border" style="width: 38px; height: 38px;" title="Attach Resume Document" disabled>
                <i class="fa-solid fa-paperclip text-muted fs-15"></i>
            </button>
            <input id="ai-user-input" type="text" class="form-control rounded-pill border-light-subtle fs-13 px-3 py-2 shadow-none" placeholder="Select an option above to begin..." disabled required>
            <button id="ai-submit-btn" type="submit" class="btn btn-secondary-custom rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;" aria-label="Send" disabled>
                <i class="fa-solid fa-paper-plane text-white fs-14"></i>
            </button>
        </form>
    </div>
</div>
